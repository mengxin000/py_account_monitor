<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Observatory · 账户监控</title><link rel="stylesheet" href="static/styles.css"></head>
<body><header><div class="brand"><span class="logo">◈</span> OBSERVATORY <small>监控程序</small></div><div><span id="connection" class="badge">未连接</span><button id="logout">退出</button></div></header>
<main><section id="login" class="login"><p class="eyebrow">PRIVATE MONITOR</p></p><form id="loginForm"><label>后端地址<input id="backend" placeholder="https://api.example.com" required></label><label>用户名<input id="username" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary">登录监控台 →</button><p id="loginError" role="alert"></p></form><a href="?demo=1">查看离线演示（模拟数据）</a></section>
<div id="dashboard" hidden><div class="toolbar"><div><p class="eyebrow">ACCOUNT OVERVIEW</p><h1>账户监控台</h1></div><div class="controls"><select id="account" aria-label="账户"></select><span id="day"></span><button id="download">下载日报 ↗</button></div></div><div id="warning" class="warning" hidden></div><section id="metrics" class="metrics"></section>
<section class="books"><article class="panel"><div class="panelhead"><span>01 / 交易腿</span><div><select id="market0"><option value="spot">Spot / Margin</option><option value="um">UM 永续</option></select><input id="symbol0" value="AAVEUSDT" aria-label="左侧交易对"></div></div><div id="book0"></div></article><article class="panel"><div class="panelhead"><span>02 / 对冲腿</span><div><select id="market1"><option value="um">UM 永续</option><option value="spot">Spot / Margin</option></select><input id="symbol1" value="AAVEUSDT" aria-label="右侧交易对"></div></div><div id="book1"></div></article></section>
<section class="panel activity"><div class="panelhead"><nav id="tabs"><button data-kind="orders" class="selected">当前挂单</button><button data-kind="recentTrades">账户成交</button><button data-kind="matches">普通配对</button><button data-kind="unmatched">未匹配</button><button data-kind="exposures">Exposure</button></nav><span id="asof"></span></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="pager"><button id="previous">上一页</button><span id="page">1</span><button id="next">下一页</button></div></section><footer><span>实时暂算 · JSONL为恢复依据 · 每小时独立核验</span><span id="verification">等待数据</span></footer></div></main><script src="static/network-policy.js" defer></script><script src="static/app.js" defer></script></body></html>
